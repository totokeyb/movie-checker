<!DOCTYPE html>
<!--
  电影时长质检仪（move.html）

  v1.1.0  支持电视剧 + 一批稳健性优化（次版本：新增看得见的功能）
    新增
    - 现在电影和电视剧都能搜：搜索改用 TMDB 的 /search/multi，自动过滤掉"人物"结果
    - 候选列表和详情页会标出 🎞️ 电影 / 📺 剧集
    - 剧集详情：显示"单集时长"（episode_run_time 为空时用最近一集的时长兜底）、共几季几集、
      连载状态、主创（剧集一般没有导演）、分级（走 content_ratings）；海报链接跳 /tv/ 页面
    - 输入了年份时（如"片名 2024"）改为"年份对得上的排前面"，而不是严格只留这一年
      （multi 搜索没有年份参数，剧集的年份是首播年份）
    优化
    - 所有 TMDB 返回的文字（片名/简介/角色名等）进页面前都做 HTML 转义，避免被特殊字符搞乱页面
    - 连续操作时丢弃过期请求（快速换词搜索、快速点候选），不会出现旧结果盖掉新结果
    - 回车搜索会忽略中文输入法选词时的那一下回车，不再选词就触发搜索
    - 报错更具体：令牌无效 / 请求太频繁 / 网络错误（可能需要代理）/ 其他 HTTP 状态
    - 只输入一个年份（如 2012）时当作片名搜索，不再因为片名为空而请求失败
    - 4 处重复的 fetch 合并成一个 tmdb() 函数；同时支持 v3 的 32 位 API Key
    - 没有中文简介时自动补英文简介并标注
    - 图片加载失败依次退到 ./default-avatar.jpg、内嵌占位图，不再依赖外部文件才能不显示裂图
    - 候选总数在没加载完时显示"约 N 个"，加载完后显示实数（TMDB 的总数里含人物，之前会偏大）
    - 候选翻页逻辑简化，加载失败时用已有结果，不卡住

  v1.0.0  初始版本，只能搜电影（版本号为补记）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影时长质检仪</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
    <style>
        :root { 
            --primary: #3498db; 
            --dark: #2c3e50; 
            --bg: #eef2f4; 
            --tmdb-blue: #01b4e4; 
            --douban-green: #00b51d; 
            --accent: #e67e22; 
            --panel: #1c2b3a; 
            --panel-2: #24374a; 
            --readout: #5be3ff; 
            --mono: 'SF Mono', 'JetBrains Mono', Consolas, Menlo, monospace; 
        }
        
        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            margin: 0; padding: 15px; color: #333;
            min-height: 100vh;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(1,180,228,0.10) 0%, transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(230,126,34,0.08) 0%, transparent 45%),
                linear-gradient(rgba(44,62,80,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44,62,80,0.05) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px, 28px 28px;
            background-attachment: fixed;
        }

        /* 主容器 */
        .container { 
            max-width: 800px; 
            margin: 40px auto; 
            background: #ffffff; 
            padding: 34px 30px 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(28,43,58,0.12), 0 2px 8px rgba(28,43,58,0.06); 
            position: relative; 
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- 容器内部：TMDB 专属局部背景层 --- */
        .container-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center 20%;
            filter: blur(4px) brightness(0.35); 
            transform: scale(1.02); 
            z-index: 1;
            opacity: 0;
            transition: opacity 0.6s ease, background-image 0.6s ease;
            pointer-events: none;
        }

        /* 框架内部内容提质层，确保内容在背景层之上 */
        .container-content {
            position: relative;
            z-index: 2;
        }

        /* 当处于沉浸详情模式时，主卡片框架内文字颜色自动调浅，确保高可读性 */
        .container.immersive-mode {
            background: #1c2b3a; 
            color: #f5f7fa;
        }

        /* 胶片齿孔装饰条 */
        .container::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 10px;
            background-color: #232f3a;
            background-image: radial-gradient(circle, var(--bg) 2.2px, transparent 2.3px);
            background-size: 18px 10px;
            background-position: 9px center;
            z-index: 3;
        }

        .search-box { display: flex; gap: 10px; margin-bottom: 25px; position: sticky; top: 0; background: transparent; padding: 5px 0; z-index: 10; }
        input { flex: 1; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; outline: none; transition: 0.3s; background: rgba(255,255,255,0.95); }
        input:focus { border-color: var(--tmdb-blue); box-shadow: 0 0 0 4px rgba(1, 180, 228, 0.1); background: #fff; }

        .paste-btn { padding: 0 15px; background: #fff; color: var(--tmdb-blue); border: 2px solid var(--tmdb-blue); border-radius: 12px; cursor: pointer; font-size: 20px; transition: 0.3s; }
        .paste-btn:hover { background: var(--tmdb-blue); color: white; }
        .search-btn { padding: 0 25px; background: var(--tmdb-blue); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; }

        .movie-card { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 25px; flex-wrap: wrap; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 海报容器：增加深色背景，配合 overflow:hidden 防止白边漏出 */
        .poster-box { 
            flex-shrink: 0; 
            cursor: pointer; 
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); 
            width: 220px; 
            transition: 0.3s; 
            background: #1c2b3a; /* 垫底暗色背景 */
        }
        .poster-box:hover { transform: scale(1.03); box-shadow: 0 12px 25px rgba(0,0,0,0.4); }
        
        /* 💡 海报图片：微调 scale(1.01) 彻底消灭亚像素计算产生的白色微缝 */
        .poster { 
            width: 100%; 
            height: auto; 
            display: block; 
            transform: scale(1.01); 
            transform-origin: center;
        }

        .info { flex: 1; min-width: 300px; }
        
        .title { font-size: 28px; font-weight: 800; color: var(--dark); margin: 0; letter-spacing: -0.5px; transition: color 0.3s; }
        .immersive-mode .title { color: #ffffff; }
        
        .meta { color: #5a6b7a; font-size: 14px; margin-top: 5px; font-weight: 600; transition: color 0.3s; }
        .immersive-mode .meta { color: #a5b8c9; }

        .director-line { color: #5a6b7a; font-size: 13px; margin-top: 6px; transition: color 0.3s; }
        .director-line b { color: var(--dark); transition: color 0.3s; }
        .immersive-mode .director-line { color: #a5b8c9; }
        .immersive-mode .director-line b { color: #ffffff; }

        /* 类型标签 */
        .genre-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
        .genre-tag { background: rgba(44, 62, 80, 0.08); color: #2c3e50; padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 700; transition: background 0.3s, color 0.3s; }
        .immersive-mode .genre-tag { background: rgba(255, 255, 255, 0.15); color: #eef2f5; }

        .badge-group { margin: 15px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .score-tag { color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; }
        .rating-tag { background: var(--accent); color: #fff; padding: 3px 11px; border-radius: 8px; font-size: 14px; font-weight: bold; }

        .douban-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--douban-green); color: white;
            text-decoration: none; padding: 6px 15px; border-radius: 8px;
            font-size: 13px; font-weight: bold; transition: 0.3s;
        }
        .douban-btn:hover { background: #008e17; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,181,29,0.3); }

        /* 片长仪表读数面板 */
        .runtime-panel {
            background: linear-gradient(150deg, var(--panel) 0%, var(--panel-2) 100%);
            border-radius: 14px; padding: 18px 22px; margin: 20px 0;
            display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        /* 📐 仪表盘底部精密物理刻度尺 */
        .runtime-panel::after {
            content: ""; 
            position: absolute; 
            left: 0; right: 0; bottom: 0; 
            height: 12px; 
            background-image: 
                linear-gradient(90deg, rgba(127,168,201,0.7) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(127,168,201,0.3) 1px, transparent 1px);
            background-size: 100px 8px, 10px 4px; 
            background-repeat: repeat-x;
            background-position: bottom left;
        }

        .runtime-label { font-size: 11px; letter-spacing: 1.5px; color: #7fa8c9; text-transform: uppercase; font-weight: 700; flex-basis: 100%; }
        .runtime-readout { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--readout); letter-spacing: 0.5px; text-shadow: 0 0 18px rgba(91,227,255,0.35); animation: fadeIn 0.4s ease; }
        .runtime-sub { font-family: var(--mono); font-size: 13px; color: #8ea6ba; }

        /* 剧情大纲 */
        .overview { font-size: 15px; line-height: 1.7; color: #333; background: rgba(255,255,255,0.85); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); transition: color 0.3s, background 0.3s; }
        .immersive-mode .overview { color: #e1e7ed; background: rgba(0, 0, 0, 0.35); border-color: rgba(255,255,255,0.05); }

        /* 主要演职人员 */
        .cast-header-title { font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; color: var(--dark); transition: color 0.3s, border 0.3s; }
        .immersive-mode .cast-header-title { color: #ffffff; border-color: rgba(255,255,255,0.1); }

        .cast-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; margin-top: 15px; }
        .cast-list .cast-item:nth-child(n+7) { display: none; }
        .cast-list.expanded .cast-item:nth-child(n+7) { display: block; }
        .cast-item a { text-decoration: none; color: inherit; display: block; transition: 0.3s; }
        .cast-item a:hover { transform: translateY(-5px); }

        /* 演职人员头像：同步增加溢出处理，避免出现白边 */
        .cast-img { 
            width: 100%; 
            height: 150px; 
            object-fit: cover; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            margin-bottom: 8px; 
            border: 2px solid transparent; 
            background: #1c2b3a; 
            transform: scale(1.01); 
            transform-origin: center;
        }
        .cast-item a:hover .cast-img { border-color: var(--tmdb-blue); }
        
        .cast-name { font-size: 13px; font-weight: bold; display: block; color: var(--dark); transition: color 0.3s; }
        .immersive-mode .cast-name { color: #ffffff; }

        .cast-role { font-size: 11px; color: #666; transition: color 0.3s; }
        .immersive-mode .cast-role { color: #a5b8c9; }

        .cast-toggle { text-align: center; margin-top: 14px; }
        .cast-toggle button {
            background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.1); padding: 6px 18px; border-radius: 20px;
            font-size: 12px; color: #4f6578; cursor: pointer; transition: 0.2s; font-family: inherit; font-weight: 600;
        }
        .cast-toggle button:hover { border-color: var(--tmdb-blue); color: var(--tmdb-blue); background: #fff; }
        .immersive-mode .cast-toggle button { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.15); color: #a5b8c9; }
        .immersive-mode .cast-toggle button:hover { background: rgba(255, 255, 255, 0.2); color: #ffffff; }

        .settings-link { text-align: right; margin-top: 30px; font-size: 12px; color: #aaa; }
        .settings-link span { cursor: pointer; text-decoration: underline; }

        /* --- 候选结果列表 --- */
        .candidate-header { font-weight: bold; color: #5a6b7a; margin-bottom: 15px; font-size: 14px; }
        .candidate-list { display: flex; flex-direction: column; gap: 10px; }
        .candidate-item {
            display: flex; gap: 15px; align-items: center; padding: 10px;
            border: 2px solid rgba(0,0,0,0.05); border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: left;
            background: rgba(255,255,255,0.8);
        }
        .candidate-item:hover { border-color: var(--tmdb-blue); background: #f5fbfe; transform: translateY(-5px); box-shadow: 0 8px 18px rgba(1,180,228,0.15); }
        .candidate-poster-wrap { position: relative; flex-shrink: 0; }
        .candidate-rank {
            position: absolute; top: -6px; left: -6px;
            background: rgba(28,43,58,0.78); color: #e8f6fb;
            font-family: var(--mono); font-size: 10px; font-weight: 700;
            padding: 2px 6px; border-radius: 6px; letter-spacing: 0.3px;
        }
        
        /* 候选区小海报同步抗白缝 */
        .candidate-img { 
            width: 55px; 
            height: 82px; 
            object-fit: cover; 
            border-radius: 6px; 
            flex-shrink: 0; 
            background: #1c2b3a; 
            transform: scale(1.01);
        }
        .candidate-info { flex: 1; min-width: 0; }
        .candidate-title { font-weight: bold; font-size: 16px; color: var(--dark); }
        .candidate-meta { font-size: 12px; color: #7f8c8d; margin: 2px 0 4px; }
        .candidate-overview { font-size: 12px; color: #666; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(44, 62, 80, 0.08); color: #2c3e50; border: none;
            padding: 7px 16px 7px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            margin: 0 0 18px; transition: 0.2s; font-family: inherit;
        }
        .back-btn svg { flex-shrink: 0; transition: transform 0.2s; }
        .back-btn:hover { background: #e3f4fb; color: var(--tmdb-blue); }
        .back-btn:hover svg { transform: translateX(-2px); }
        .immersive-mode .back-btn { background: rgba(255,255,255,0.15); color: #ffffff; }
        .immersive-mode .back-btn:hover { background: rgba(255,255,255,0.25); }

        /* --- 分页控件 --- */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 18px; flex-wrap: wrap; }
        .page-btn {
            min-width: 34px; height: 34px; padding: 0 8px;
            border: 2px solid rgba(0,0,0,0.05); border-radius: 8px; background: rgba(255,255,255,0.8);
            color: #5a6b7a; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: 0.2s; font-family: inherit;
        }
        .page-btn:hover:not(:disabled) { border-color: var(--tmdb-blue); color: var(--tmdb-blue); }
        .page-btn.active { background: var(--tmdb-blue); border-color: var(--tmdb-blue); color: #fff; }
        .page-btn:disabled { opacity: 0.35; cursor: default; }

        @media (max-width: 600px) { .poster-box { width: 100%; } .search-box { flex-wrap: wrap; } }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <!-- 局部容器内沉浸式背景图层 -->
    <div id="containerBackdrop" class="container-backdrop"></div>

    <!-- 包装一层用于提升图层层级的内容容器 -->
    <div class="container-content">
        <div class="search-box">
            <input type="text" id="movieName" placeholder="粘贴电影/剧集标题或输入片名..." autocomplete="off">
            <button class="paste-btn" onclick="handlePaste()" title="粘贴并搜索">📋</button>
            <button class="search-btn" onclick="searchMedia()">核查</button>
        </div>
        
        <div id="result" style="text-align:center; padding: 46px 0; color:#bbb;">
            <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="#d3dbe1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;">
                <rect x="3" y="8.5" width="18" height="12" rx="2"/>
                <path d="M3 8.5l1.3-4h3.4L6.8 8.5"/>
                <path d="M9.3 8.5l1.3-4h3.4l-1.3 4"/>
                <path d="M15.6 8.5l1.3-4h3.4l-1.3 4"/>
                <line x1="3" y1="8.5" x2="21" y2="8.5"/>
            </svg>
            <div>等待输入，开启高效质检之旅...</div>
        </div>

        <div class="settings-link">
            <span onclick="resetToken()">重置 API TOKEN</span>
        </div>
    </div>
</div>

<script>
    let TOKEN = localStorage.getItem('tmdb_access_token');

    const app = {
        candidates: [],      // 已加载的候选（电影 + 剧集，已过滤掉人物）
        candidatePage: 1,
        selectedMedia: null,
        tmdbPage: 1,         // 已加载到 TMDB 的第几页
        tmdbTotalPages: 1,   // TMDB 总页数（已按 MAX_TMDB_PAGES 封顶）
        tmdbTotalResults: 0,
        exhausted: false,    // TMDB 的结果是否已经全部加载完
        query: '',
        year: '',
        seq: 0               // 异步请求序号：新操作开始后，旧请求回来的结果直接丢弃
    };
    const CANDIDATES_PER_PAGE = 10;
    const MAX_TMDB_PAGES = 5;

    const TYPE_LABEL = { movie: '🎞️ 电影', tv: '📺 剧集' };
    const STATUS_LABEL = {
        'Returning Series': '连载中', 'Ended': '已完结', 'Canceled': '已取消',
        'In Production': '制作中', 'Planned': '计划中', 'Pilot': '试播'
    };

    // 图片全部加载失败时的最后兜底（内嵌 SVG，不依赖外部文件）
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="150" viewBox="0 0 100 150">' +
        '<rect width="100" height="150" fill="#1c2b3a"/><circle cx="50" cy="56" r="16" fill="#3a5068"/>' +
        '<path d="M20 124c0-18 14-30 30-30s30 12 30 30z" fill="#3a5068"/></svg>');

    // 图片加载失败：先退到 ./default-avatar.jpg，它也没有就用内嵌占位图
    function imgFallback(img) {
        if (img.dataset.step === '2') { img.onerror = null; return; }
        if (!img.dataset.step) {
            img.dataset.step = '1';
            if (!/default-avatar\.jpg$/.test(img.src)) { img.src = './default-avatar.jpg'; return; }
        }
        img.dataset.step = '2';
        img.src = PLACEHOLDER;
    }

    // HTML 转义：TMDB 的片名、简介、角色名都是网友可编辑的内容，不能直接塞进 innerHTML
    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    window.onload = function() {
        if (!TOKEN) askForToken();
        document.getElementById('movieName').focus();
    };

    function askForToken() {
        const input = prompt("请输入您的 TMDB API TOKEN（eyJ 开头的 Read Access Token，或 32 位 API Key）:");
        if (input && input.trim().length >= 30) {
            localStorage.setItem('tmdb_access_token', input.trim());
            TOKEN = input.trim();
            location.reload();
        } else if (input) {
            alert("这看起来不是有效的 TMDB 令牌，请检查后重试。");
        }
    }

    function resetToken() {
        if(confirm("确定要清除保存的 API TOKEN 吗？")) {
            localStorage.removeItem('tmdb_access_token');
            location.reload();
        }
    }

    // 统一的 TMDB 请求：v4 令牌（eyJ 开头）走 Bearer 头，v3 的 32 位 Key 走 api_key 参数
    async function tmdb(path, params = {}) {
        const url = new URL('https://api.themoviedb.org/3' + path);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        const headers = {};
        if (TOKEN.startsWith('eyJ')) headers.Authorization = `Bearer ${TOKEN}`;
        else url.searchParams.set('api_key', TOKEN);
        const res = await fetch(url, { headers });
        if (!res.ok) {
            const e = new Error(`HTTP ${res.status}`);
            e.status = res.status;
            throw e;
        }
        return res.json();
    }

    function errorHtml(err, prefix = '检索失败') {
        if (err.status === 401) return "🔑 TOKEN 无效或已过期，请点击下方「重置 API TOKEN」后重新输入";
        if (err.status === 429) return "⏳ 请求太频繁了，稍等几秒再试";
        if (err instanceof TypeError) return `⚠️ ${prefix}：网络错误（访问 TMDB 可能需要代理）`;
        return `⚠️ ${prefix}：${esc(err.message)}`;
    }

    async function handlePaste() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                document.getElementById('movieName').value = text;
                searchMedia();
            }
        } catch (e) { alert("无法访问剪贴板。"); }
    }

    // 更新容器局部背景辅助函数
    function updateContainerBackdrop(backdropPath) {
        const backdropLayer = document.getElementById('containerBackdrop');
        const container = document.getElementById('mainContainer');
        if (backdropPath) {
            backdropLayer.style.backgroundImage = `url('https://image.tmdb.org/t/p/w780${backdropPath}')`;
            backdropLayer.style.opacity = '1';
            container.classList.add('immersive-mode');
        } else {
            backdropLayer.style.opacity = '0';
            container.classList.remove('immersive-mode');
        }
    }

    // 拆出"片名"和"末尾年份"。只输入了一个年份（如 2012）时，把它当片名，不当年份
    function parseQuery(inputVal) {
        const cleanInput = inputVal.replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
        const yearMatch = cleanInput.match(/\b(19|20)\d{2}$/);
        const title = yearMatch ? cleanInput.replace(yearMatch[0], '').trim() : cleanInput;
        if (!title) return { title: cleanInput, year: '' };
        return { title, year: yearMatch ? yearMatch[0] : '' };
    }

    const yearOfResult = r => (r.release_date || r.first_air_date || '').slice(0, 4);

    // 只留电影和剧集（multi 搜索还会混进"人物"）；输入了年份时，年份对得上的排前面
    function pickMedia(results, year) {
        const list = (results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
        if (!year) return list;
        return list.filter(r => yearOfResult(r) === year).concat(list.filter(r => yearOfResult(r) !== year));
    }

    function addCandidates(results) {
        const seen = new Set(app.candidates.map(r => r.media_type + r.id));
        pickMedia(results, app.year).forEach(r => {
            const key = r.media_type + r.id;
            if (!seen.has(key)) { seen.add(key); app.candidates.push(r); }
        });
    }

    function fetchSearchPage(page) {
        return tmdb('/search/multi', { query: app.query, language: 'zh-CN', include_adult: 'false', page });
    }

    async function searchMedia() {
        if (!TOKEN) { askForToken(); return; }
        const resultDiv = document.getElementById('result');
        const inputVal = document.getElementById('movieName').value.trim();
        if (!inputVal) return;

        const seq = ++app.seq;
        resultDiv.innerHTML = "<div style='text-align:center; padding:40px;'>✨ 正在为您检索官方原始档案...</div>";
        updateContainerBackdrop(null); // 搜索新片时重置局部背景

        try {
            const q = parseQuery(inputVal);
            app.query = q.title;
            app.year = q.year;
            app.candidates = [];

            const sData = await fetchSearchPage(1);
            if (seq !== app.seq) return;

            addCandidates(sData.results);
            if (!app.candidates.length) {
                resultDiv.innerHTML = "❌ 未找到该影片或剧集，请微调关键词";
                return;
            }

            app.candidatePage = 1;
            app.tmdbPage = 1;
            app.tmdbTotalPages = Math.min(sData.total_pages || 1, MAX_TMDB_PAGES);
            app.tmdbTotalResults = sData.total_results || 0;
            app.exhausted = app.tmdbPage >= app.tmdbTotalPages;

            showMediaDetail(app.candidates[0].media_type, app.candidates[0].id);
        } catch (err) {
            if (seq === app.seq) resultDiv.innerHTML = errorHtml(err);
        }
    }

    // 候选总数：没加载完时只能估算（TMDB 的总数里还含人物），加载完就是实数
    function candidateTotal() {
        return app.exhausted ? app.candidates.length : Math.min(app.tmdbTotalResults, MAX_TMDB_PAGES * 20);
    }

    function renderCandidateList() {
        updateContainerBackdrop(null); // 返回列表时，容器背景还原为白底

        const resultDiv = document.getElementById('result');
        const total = candidateTotal();
        const totalPages = Math.max(1, Math.ceil(total / CANDIDATES_PER_PAGE));
        app.candidatePage = Math.min(Math.max(1, app.candidatePage), totalPages);

        const start = (app.candidatePage - 1) * CANDIDATES_PER_PAGE;
        const pageItems = app.candidates.slice(start, start + CANDIDATES_PER_PAGE);

        resultDiv.innerHTML = `
            <div class="candidate-header">找到${app.exhausted ? '' : '约'} ${total} 个可能匹配的结果，请选择正确的一项：</div>
            <div class="candidate-list">
                ${pageItems.map((r, i) => `
                    <div class="candidate-item" onclick="showMediaDetail('${r.media_type}', ${r.id})">
                        <div class="candidate-poster-wrap">
                            <img src="${r.poster_path ? 'https://image.tmdb.org/t/p/w154'+r.poster_path : './default-avatar.jpg'}" class="candidate-img" onerror="imgFallback(this)">
                            <span class="candidate-rank">#${start + i + 1}</span>
                        </div>
                        <div class="candidate-info">
                            <div class="candidate-title">${esc(r.title || r.name || '未知片名')}</div>
                            <div class="candidate-meta">${TYPE_LABEL[r.media_type]} · ${esc(r.original_title || r.original_name || '')} · ${yearOfResult(r) || '未知年份'}</div>
                            <div class="candidate-overview">${esc(r.overview || '暂无简介。')}</div>
                        </div>
                    </div>
                `).join('')}
            </div>
            ${totalPages > 1 ? renderPagination(totalPages) : ''}
        `;
    }

    function renderPagination(totalPages) {
        const cur = app.candidatePage;
        const pageBtns = [];
        for (let p = 1; p <= totalPages; p++) {
            pageBtns.push(`<button class="page-btn${p === cur ? ' active' : ''}" onclick="goToCandidatePage(${p})">${p}</button>`);
        }
        return `
            <div class="pagination">
                <button class="page-btn" onclick="goToCandidatePage(${cur - 1})" ${cur === 1 ? 'disabled' : ''}>‹</button>
                ${pageBtns.join('')}
                <button class="page-btn" onclick="goToCandidatePage(${cur + 1})" ${cur === totalPages ? 'disabled' : ''}>›</button>
            </div>
        `;
    }

    async function goToCandidatePage(page) {
        const seq = ++app.seq;
        const needed = page * CANDIDATES_PER_PAGE;

        if (app.candidates.length < needed && !app.exhausted) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "<div style='text-align:center; padding:40px;'>✨ 正在加载更多候选结果...</div>";
            try {
                while (app.candidates.length < needed && !app.exhausted) {
                    const nextData = await fetchSearchPage(app.tmdbPage + 1);
                    if (seq !== app.seq) return;
                    app.tmdbPage++;
                    addCandidates(nextData.results);
                    app.exhausted = app.tmdbPage >= app.tmdbTotalPages;
                }
            } catch (e) { /* 加载失败就先用已经有的 */ }
        }

        if (seq !== app.seq) return;
        app.candidatePage = page;
        renderCandidateList();
    }

    // 电影和剧集的数据结构不一样，统一整理成同一种格式
    function normalizeMedia(d, type) {
        const isTV = type === 'tv';

        // 时长：电影是 runtime；剧集是"单集时长"，episode_run_time 经常是空的，就用最近一集的时长兜底
        let runtimeMinutes = 0;
        if (isTV) {
            runtimeMinutes = (d.episode_run_time || []).find(n => n > 0)
                || d.last_episode_to_air?.runtime
                || d.next_episode_to_air?.runtime
                || 0;
        } else {
            runtimeMinutes = d.runtime || 0;
        }
        if (typeof runtimeMinutes !== 'number') runtimeMinutes = 0;

        // 分级：优先中国，其次美国，再随便取一个
        let certification = 'NR';
        try {
            if (isTV) {
                const rs = d.content_ratings?.results || [];
                const byCountry = (iso) => rs.find(r => r.iso_3166_1 === iso && r.rating)?.rating;
                certification = byCountry('CN') || byCountry('US') || rs.find(r => r.rating)?.rating || 'NR';
            } else {
                const releaseResults = d.release_dates?.results || [];
                const certFromCountry = (iso) => {
                    const country = releaseResults.find(r => r.iso_3166_1 === iso);
                    return country?.release_dates?.find(rd => rd.certification !== '')?.certification;
                };
                const certFromAny = releaseResults
                    .map(r => r.release_dates?.find(rd => rd.certification !== '')?.certification)
                    .find(Boolean);
                certification = certFromCountry('CN') || certFromCountry('US') || certFromAny || 'NR';
            }
        } catch (e) {
            certification = 'NR';
        }

        // 电影显示导演；剧集一般没有导演，显示主创
        const creatorLabel = isTV ? '主创' : '导演';
        const creator = isTV
            ? (d.created_by || []).map(c => c.name).filter(Boolean).join('、')
            : ((d.credits?.crew || []).find(c => c.job === 'Director')?.name || '');

        const date = isTV ? d.first_air_date : d.release_date;

        return {
            type,
            id: d.id,
            title: (isTV ? d.name : d.title) || '未知片名',
            originalTitle: (isTV ? d.original_name : d.original_title) || '',
            year: date ? date.split('-')[0] : '未知',
            runtimeMinutes,
            runtimeHours: Math.floor(runtimeMinutes / 60),
            runtimeRemainMinutes: runtimeMinutes % 60,
            hasRuntime: runtimeMinutes > 0,
            voteAverage: typeof d.vote_average === 'number' ? d.vote_average : 0,
            certification,
            creatorLabel,
            creator,
            genres: (d.genres || []).map(g => g.name).filter(Boolean),
            posterPath: d.poster_path || null,
            backdropPath: d.backdrop_path || null,
            overview: d.overview || '',
            overviewIsEnglish: false,
            seasons: isTV ? (d.number_of_seasons || 0) : 0,
            episodes: isTV ? (d.number_of_episodes || 0) : 0,
            statusText: isTV ? (STATUS_LABEL[d.status] || '') : '',
            cast: (d.credits?.cast || []).map(p => ({
                id: p.id,
                name: p.name || '未知演员',
                character: p.character || 'Cast',
                profilePath: p.profile_path || null
            }))
        };
    }

    async function fetchMediaDetail(type, id) {
        const append = type === 'tv' ? 'content_ratings,credits' : 'release_dates,credits';
        const d = await tmdb(`/${type}/${id}`, { language: 'zh-CN', append_to_response: append });
        const media = normalizeMedia(d, type);

        // 没有中文简介时，补一份英文的，总比"暂无记载"强
        if (!media.overview) {
            try {
                const en = await tmdb(`/${type}/${id}`, { language: 'en-US' });
                if (en.overview) { media.overview = en.overview; media.overviewIsEnglish = true; }
            } catch (e) { /* 补不到就算了 */ }
        }
        if (!media.overview) media.overview = '暂无详细记载。';
        return media;
    }

    function scoreBadgeStyle(score) {
        if (score >= 8) return 'background: linear-gradient(135deg, #f39c12, #e67e22);';
        if (score >= 6) return 'background: linear-gradient(135deg, #f4d03f, #f1c40f);';
        if (score > 0) return 'background: linear-gradient(135deg, #95a5a6, #7f8c8d);';
        return 'background: linear-gradient(135deg, #bdc3c7, #95a5a6);';
    }

    function buildDoubanSearchLink(media) {
        const hasYear = media.year && media.year !== '未知';
        const searchText = hasYear ? `${media.title} ${media.year}` : media.title;
        // cat=1002 只限电影；剧集不带分类，让豆瓣自己在影视里找
        const cat = media.type === 'movie' ? '&cat=1002' : '';
        return `https://search.douban.com/movie/subject_search?search_text=${encodeURIComponent(searchText)}${cat}`;
    }

    function toggleCastList() {
        const list = document.getElementById('castList');
        const btn = document.getElementById('castToggleBtn');
        if (!list || !btn) return;
        const expanded = list.classList.toggle('expanded');
        btn.textContent = expanded ? '收起 ▲' : `查看全部 ${list.children.length} 位演职人员 ▼`;
    }

    function renderMediaDetail(media) {
        // 渲染详情时加载框架局部背景
        updateContainerBackdrop(media.backdropPath);

        const isTV = media.type === 'tv';
        const resultDiv = document.getElementById('result');
        const doubanLink = buildDoubanSearchLink(media);
        const backLink = `<div style="text-align:left;">
                    <button class="back-btn" onclick="renderCandidateList()" title="重新选择正确的一项">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                        返回候选列表
                    </button>
               </div>`;

        const seriesInfo = isTV
            ? [media.seasons ? `共 ${media.seasons} 季` : '', media.episodes ? `${media.episodes} 集` : '', media.statusText].filter(Boolean).join(' · ')
            : '';

        resultDiv.innerHTML = `
            ${backLink}
            <div class="movie-card">
                <a href="https://www.themoviedb.org/${media.type}/${media.id}?language=zh-CN" target="_blank" class="poster-box" title="点击查看 TMDB 详情">
                    <img src="${media.posterPath ? 'https://image.tmdb.org/t/p/w500'+media.posterPath : './default-avatar.jpg'}" class="poster" onerror="imgFallback(this)">
                </a>
                <div class="info">
                    <div class="title">${esc(media.title)}</div>
                    <div class="meta">${TYPE_LABEL[media.type]} · ${esc(media.originalTitle)} · ${esc(media.year)}</div>
                    ${seriesInfo ? `<div class="director-line">${esc(seriesInfo)}</div>` : ''}
                    ${media.creator ? `<div class="director-line"><b>${media.creatorLabel}</b> ${esc(media.creator)}</div>` : ''}
                    ${media.genres.length ? `<div class="genre-row">${media.genres.map(g => `<span class="genre-tag">${esc(g)}</span>`).join('')}</div>` : ''}
                    <div class="badge-group">
                        <span class="score-tag" style="${scoreBadgeStyle(media.voteAverage)}">⭐ ${media.voteAverage.toFixed(1)}</span>
                        <span class="rating-tag">分级：${esc(media.certification)}</span>
                        <a href="${doubanLink}" target="_blank" class="douban-btn" title="在豆瓣中搜索">
                            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 24c6.627 0 12-5.373 12-12S18.627 0 12 0 0 5.373 0 12s5.373 12 12 12z" fill="#00b51d"/><path d="M11 6.5h2v1h-2v-1zm4 1h-6v1h6v-1zm-6 3h6v1h-6v-1zm1 4.5h-2.5v1h1v1.5h-1v1h4v-1h-1v-1.5h1.5l1.5-1.5v-1h-3.5v1h1.5l-1 1zm-3-3v1h8v-1h-8z" fill="#fff"/></svg>
                            豆瓣搜索
                        </a>
                    </div>
                    <div class="runtime-panel">
                        <span class="runtime-label">${isTV ? '官方核定单集时长' : '官方核定原始时长'}</span>
                        ${media.hasRuntime ? `
                        <span class="runtime-readout">${media.runtimeHours}h ${String(media.runtimeRemainMinutes).padStart(2,'0')}m</span>
                        <span class="runtime-sub">${media.runtimeMinutes} min${isTV ? ' / 集' : ''}</span>
                        ` : `<span class="runtime-readout" style="font-size:18px; color:#7fa8c9;">暂无数据</span>`}
                    </div>
                    <div class="overview"><strong>剧情大纲：</strong>${media.overviewIsEnglish ? ' <small style="opacity:.7;">（暂无中文简介，以下为英文）</small>' : ''}<br>${esc(media.overview)}</div>
                </div>
            </div>
            <div class="cast-header-title">🎬 主要演职人员</div>
            <div class="cast-list" id="castList">${media.cast.map(p => `
                <div class="cast-item">
                    <a href="https://www.themoviedb.org/person/${p.id}?language=zh-CN" target="_blank">
                       <img src="${p.profilePath ? 'https://image.tmdb.org/t/p/w185'+p.profilePath : './default-avatar.jpg'}"
     class="cast-img"
     onerror="imgFallback(this)">
                        <span class="cast-name">${esc(p.name)}</span>
                        <span class="cast-role">${esc(p.character)}</span>
                    </a>
                </div>
            `).join('')}</div>
            ${media.cast.length > 6 ? `<div class="cast-toggle"><button id="castToggleBtn" onclick="toggleCastList()">查看全部 ${media.cast.length} 位演职人员 ▼</button></div>` : ''}
        `;
    }

    async function showMediaDetail(type, id) {
        const seq = ++app.seq;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = "<div style='text-align:center; padding:40px;'>✨ 正在加载详情...</div>";

        try {
            const media = await fetchMediaDetail(type, id);
            if (seq !== app.seq) return;
            app.selectedMedia = media;
            renderMediaDetail(media);
        } catch (err) {
            if (seq === app.seq) resultDiv.innerHTML = errorHtml(err, '详情加载失败');
        }
    }

    // 回车搜索；中文输入法选词时按的回车（isComposing / keyCode 229）不算
    document.getElementById('movieName').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) searchMedia();
    });
</script>
